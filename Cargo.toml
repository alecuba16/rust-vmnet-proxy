[package]
name = "rust-vmnet-proxy"
version = "0.2.11"
edition = "2021"
description = "Rootless macOS proxy: direct SOCKS5 via bridged socket_vmnet plus supervised SSH tunnels"
license = "MIT"

[dependencies]
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "log",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-tcp",
    "socket-udp",
    "socket-dhcpv4",
    "socket-dns",
    "iface-neighbor-cache-count-128",
    "iface-max-addr-count-4",
    "iface-max-route-count-4",
    "iface-max-multicast-group-count-4",
    "fragmentation-buffer-size-65536",
    "assembler-max-segment-count-32",
    "auto-icmp-echo-reply",
    "socket-tcp-reno",
] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
log = { version = "0.4", features = ["std"] }

[dev-dependencies]
smoltcp = { version = "0.14", default-features = false, features = [
    "std",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true